[project]
name = "fms-sim"
version = "0.1.0"
description = "Імітаційна модель роботизованої ГВС (варіант B20) на основі мережі масового обслуговування"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
fms = "fms.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
